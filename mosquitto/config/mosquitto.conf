# Configuração do broker MQTT (Mosquitto 2.x)
# Detalhes em docs/04-mqtt.md

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous false
# Arquivo gerado por scripts/setup.sh a partir do usuário/senha do .env
password_file /mosquitto/config/passwd
