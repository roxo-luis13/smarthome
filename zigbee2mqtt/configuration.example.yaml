# Modelo de configuração do Zigbee2MQTT.
# scripts/setup.sh copia este arquivo para zigbee2mqtt/data/configuration.yaml
# na primeira vez. Depois disso, edite o arquivo em data/ (ele não vai para o git,
# pois o Zigbee2MQTT grava nele as chaves da sua rede Zigbee).
# Usuário e senha do MQTT vêm do .env (variáveis no docker-compose.yml).
# Detalhes em docs/05-zigbee.md

homeassistant:
  enabled: true

frontend:
  enabled: true
  port: 8080

mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mosquitto:1883

serial:
  port: /dev/ttyZigbee
  # Ajuste conforme seu adaptador:
  #   Sonoff ZBDongle-E / SkyConnect / ZBT-1  -> ember
  #   Sonoff ZBDongle-P / CC2652              -> zstack
  adapter: ember

advanced:
  # GENERATE = o Zigbee2MQTT cria chaves aleatórias na primeira execução.
  # Essas chaves ficam em data/configuration.yaml: NÃO as perca (backup!),
  # senão todos os dispositivos precisam ser pareados de novo.
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE
  log_level: warning
